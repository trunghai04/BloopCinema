apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: bloop-cinema
type: Opaque
stringData:
  AUTH_DATABASE_URL: postgres://auth_user:auth_service_pw_change_me@postgres-auth:5432/auth_db?sslmode=disable
  CATALOG_DATABASE_URL: postgres://catalog_user:catalog_service_pw_change_me@postgres-catalog:5432/catalog_db?sslmode=disable
  BOOKING_DATABASE_URL: postgres://booking_user:booking_service_pw_change_me@postgres-booking:5432/booking_db?sslmode=disable
  JWT_SECRET: replace-with-strong-random-secret
